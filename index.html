<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tassen-Attentat</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone-shaped screen. Status strip, the kitchen on a canvas, one giant paw button. */
:root{
  --ground:#ffe6dc; --panel:#fffaf3; --ink:#4a2f3f; --soft:#7d6070;
  --berry:#e85d8a; --berry-deep:#b93a67; --mint:#58c9a5; --mint-deep:#237f63;
  --butter:#ffc94f; --butter-deep:#8a5b00; --tomato:#ef5350; --tomato-deep:#a61f26; --on-strong:#fffaf3;
  --line:#f2cfc3;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);overscroll-behavior:none;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,0px);padding-right:max(16px,0px);padding-top:10px;padding-bottom:10px;position:relative}
#hud{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;min-height:44px}
#hud>div{min-width:0}
#room{font-size:.8rem;color:var(--soft);line-height:1.1}
#money{white-space:nowrap;font-family:var(--display);font-size:1.22rem;line-height:1.1;font-variant-numeric:tabular-nums}
#right{display:flex;align-items:center;gap:10px}
#lives{display:flex;gap:2px}
#lives svg{width:30px;height:20px}
#mute{width:44px;height:44px;border:0;border-radius:50%;background:var(--panel);color:var(--ink);font:800 .72rem var(--body);cursor:pointer}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas#c{display:block;border-radius:22px;touch-action:none;max-width:100%}
#paw{flex:none;height:84px;border:0;border-radius:42px;background:var(--mint-deep);color:var(--on-strong);
  font-family:var(--display);font-weight:800;font-size:1.5rem;cursor:pointer;touch-action:none;
  box-shadow:0 7px 0 #175a46;transition:transform .05s,background .1s}
#paw.warn{background:var(--butter);color:#3c2800;box-shadow:0 7px 0 var(--butter-deep)}
#paw.stop{background:var(--tomato-deep);box-shadow:0 7px 0 #6d1218}
#paw.down{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
button:focus-visible{outline:3px solid var(--berry-deep);outline-offset:2px}
#overlay{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:flex-end;justify-content:center;overflow:auto;
  padding-left:max(16px,0px);padding-right:max(16px,0px);padding-top:14px;padding-bottom:14px}
#card{width:100%;max-width:480px;background:var(--panel);border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 12px 34px rgba(74,47,63,.28);margin-top:auto}
h1,h2{font-family:var(--display);font-weight:800;line-height:1;margin:0;text-wrap:balance}
h1{font-size:clamp(2.5rem,12vw,3.4rem);color:var(--berry-deep);transform:rotate(-2deg);transform-origin:left}
h2{font-size:2rem;color:var(--berry-deep)}
#card p{margin:0;font-size:1.02rem;line-height:1.35}
.how{display:grid;gap:5px;margin:0;padding:0;list-style:none;font-size:1rem;line-height:1.3}
.how b{font-weight:800}
.cat .best{min-height:2.7em}
.cat{align-self:start}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cat{border:3px solid transparent;background:transparent;border-radius:18px;padding:3px 0 5px;cursor:pointer;color:var(--ink);font:800 .88rem var(--body);min-width:0}
.cat canvas{width:100%;max-width:84px;display:block;margin:0 auto}
.cat[aria-pressed=true]{border-color:var(--berry);background:#ffe3ec}
.best{display:block;font-size:.72rem;color:var(--soft);font-variant-numeric:tabular-nums}
.go{height:62px;border:0;border-radius:31px;background:var(--berry-deep);color:var(--on-strong);font:800 1.45rem var(--display);cursor:pointer;box-shadow:0 5px 0 #7f2146;flex:none}
.alt{height:48px;border:2px solid var(--line);border-radius:24px;background:transparent;color:var(--ink);font:800 1rem var(--body);cursor:pointer;flex:none}
.bill{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums;max-height:34vh;overflow:auto}
.bill li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.bill li span:first-child{min-width:0}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:800 1.6rem var(--display)}
.rank{font-weight:800;color:var(--mint-deep);font-size:1.1rem}

/* Switch / alte Browser */
#app,#hud,#right,#lives,#card,.how{gap:0}#app>*+*{margin-top:8px}
#hud>*+*{margin-left:10px}#right>*+*{margin-left:10px}#lives>*+*{margin-left:2px}
#card>*+*{margin-top:12px}.how>*+*{margin-top:5px}.cats{grid-gap:6px}
@media (min-aspect-ratio:4/3) and (min-width:800px){
  html,body{height:100%}
  #app{max-width:none;height:100vh;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
       grid-template-areas:"stage hud" "stage leer" "stage paw";grid-gap:16px;gap:16px;padding:12px 24px}
  #app>*{margin:0!important}
  #app{box-sizing:border-box}
  #stage{grid-area:stage;height:calc(100vh - 24px);width:calc((100vh - 24px) * 400 / 520)}
  #hud{grid-area:hud;flex-wrap:wrap}
  #paw{grid-area:paw;height:200px;margin-bottom:8px!important;border-radius:60px;font-size:2.6rem}
  #money{font-size:2rem}#room{font-size:1rem}
  body{font-size:17px}
  #overlay{align-items:center}
  #card{margin-top:0;max-width:620px;max-height:94vh;overflow:auto}
  h1{font-size:3rem}
}
</style>

<div id="app">

  function float(s, fx, fy, col, z, life) {
    G.floats.push({ s, x: Math.max(62, Math.min(W - 62, fx)), y: fy, c: col || "#4a2f3f", z: z || 26, t: life || 1.1 });
  }
  function say(s, d) {
    G.hu.say = s;
    G.hu.sayT = d || 1.3;
  }
  function nextItem() {
    const k = G.queue.shift();
    if (!k) {
      levelDone();
      return;
    }
    G.item = { k, x: k === "gurke" ? 192 : START, y: -90, vy: 0, r: 0, ready: false, age: 0, falling: false, vx: 0, vr: 0 };
  }
  function warnHuman(fast, line2) {
    const R = room(), h = G.hu;
    h.s = "warn";
    h.t = fast || diff().warn;
    h.mad = false;
    h.fake = !fast && G.lvl > 0 && Math.random() < 0.32;
    say(line2 || pick(["Hm?", "Moment mal…", "Riecht nach Katze.", "War da was?"]), h.t + 0.2);
    SND.hmm();
  }
  function away() {
    const R = room(), h = G.hu;
    h.s = "away";
    h.t = rnd(diff().away[0], diff().away[1]);
    h.mad = false;
    if (Math.random() < 0.65) say(R.hum[Math.random() * R.hum.length | 0], 1.4);
  }
  function earn(it) {
    const d = ITEMS[it.k];
    G.money += d.eur;
    const b = G.bill[d.n] || { n: 0, s: 0 };
    b.n++;
    b.s += d.eur;
    G.bill[d.n] = b;
    updateHud();
  }
  function breakItem(it) {
    const d = ITEMS[it.k];
    float(d.hit, it.x - 6, FLOOR - 60, d.loud ? "#a61f26" : "#7d6070", d.loud ? 40 : 26);
    float("+" + eur(d.eur), it.x - 10, FLOOR - 112, "#237f63", 23, 1.3);
    const n = d.loud ? 26 : 9;
    for (let i = 0; i < n; i++) G.parts.push({ x: it.x, y: FLOOR - 8, vx: rnd(-210, 190), vy: rnd(-430, -90), r: rnd(0, 6), vr: rnd(-12, 12), s: rnd(5, 12), c: d.col[i % 2], t: 1.1 });
    G.floor.push({ k: it.k, x: rnd(EDGE + 4, W - 24), y: FLOOR + 3, r: rnd(-0.3, 0.3) });
    if (G.floor.length > 6) G.floor.shift();
    earn(it);
    G.item = null;
    G.gap = 0.7;
    G.done++;
    updateHud();
    if (d.loud) {
      SND.crash();
      shake = 1;
      meow(1.15);
      if (G.hu.s !== "look") {
        warnHuman(0.72, d.quip);
      }
    } else {
      SND.soft();
      float(d.quip, it.x - 90, FLOOR - 160, "#237f63", 20, 1.6);
    }
  }
  function caught() {
    const h = G.hu, R = room(), C = CATS[sel];
    G.phase = "caught";
    G.catchT = 1.45;
    G.lives--;
    G.clean = false;
    h.mad = true;
    say(pick(R.yell).replace("{C}", C.name.toUpperCase()).replace("{c}", C.name), 1.6);
    SND.catch();
    shake = 0.65;
    updateHud();
    G.cat.mood = "shock";
    G.cat.moodT = 1.4;
    G.cat.reach = 0;
    float("Erwischt!", G.cat.x + 36, TABLE - 178, "#a61f26", 32, 1.2);
  }
  function scare() {
    SND.eek();
    G.cat.vy = -720;
    G.cat.mood = "shock";
    G.cat.moodT = 1;
    float("IIIH! GURKE!", G.cat.x + 90, TABLE - 210, "#237f63", 32, 1.2);
    G.item.gone = true;
    if (G.hu.s === "away") warnHuman(0.85, "Was fiept da?");
  }
  function update(dt) {
    const S = G, h = S.hu, cat = S.cat;
    t += dt;
    h.turn += ((h.s === "look" || S.phase === "caught" ? 1 : h.s === "warn" ? 0.32 : 0) - h.turn) * Math.min(1, dt * 13);
    h.sayT -= dt;
    shake = Math.max(0, shake - dt * 2.8);
    cat.moodT -= dt;
    let pushing = false;
    const it = S.item;
    if (S.phase === "menu") {
      if (h.sayT < -1.2) {
        say(pick(room().hum), 1.8);
      }
      cat.mood = t % 5 < 2.4 ? "evil" : "normal";
      cat.reach = t % 5 < 2.4 ? 16 : 0;
    }
    if (S.phase === "play") {
      S.shout -= dt;
      if (S.shout <= 0) {
        S.shout = rnd(6.5, 11);
        float(pick(SHOUTS), 200, 214, "#6a3f96", 20, 2.2);
      }
      if (h.s === "away") {
        h.t -= dt;
        if (h.t <= 0) warnHuman();
      } else if (h.s === "warn") {
        h.t -= dt;
        if (h.t <= 0) {
          if (h.fake) {
            say(pick(["Ach, nix.", "Muss das Lego gewesen sein."]), 1);
            away();
          } else {
            h.s = "look";
            h.t = diff().look;
            say("", 0);
          }
        }
      } else {
        h.t -= dt;
        if (h.t <= 0) away();
      }
      if (!it) {
        S.gap -= dt;
        if (S.gap <= 0) nextItem();
      }
      if (S.item) {
        const i = S.item;
        i.age += dt;
        if (!i.ready) {
          i.vy += 1900 * dt;
          i.y += i.vy * dt;
          if (i.y >= TABLE) {
            i.y = TABLE;
            i.ready = true;
            i.age = 0;
            SND.plop();
          }
        } else if (i.falling) {
          i.vy += 1500 * dt;
          i.x += i.vx * dt;
          i.y += i.vy * dt;
          i.r += i.vr * dt;
          if (i.y >= FLOOR) {
            i.y = FLOOR;
            breakItem(i);
          }
        } else if (i.k === "gurke") {
          if (i.gone) {
            i.y -= 420 * dt;
            i.r += 9 * dt;
            if (i.y < -120) {
              S.item = null;
              S.gap = 0.35;
              S.done++;
              updateHud();
            }
          } else {
            if (hold && i.age > 0.55) scare();
            if (!i.gone && i.age > 2.8) {
              i.gone = true;
              float("Puh, nur eine Gurke!", 200, TABLE - 120, "#237f63", 28, 1);
            }
          }
        } else {
          if (hold && cat.jump === 0) {
            pushing = true;
            i.x += ITEMS[i.k].v * dt;
            if (i.x > EDGE - 3) {
              i.falling = true;
              i.vx = 95;
              i.vy = 20;
              i.vr = 7;
              pushing = false;
            }
          }
          i.r = !i.falling && i.x > EDGE - 40 ? Math.sin(t * 38) * 0.05 : i.r;
          if (pushing && h.s === "look" && h.turn > 0.75) {
            caught();
            pushing = false;
          }
        }
      }
    }
    if (S.phase === "caught") {
      S.catchT -= dt;
      if (S.catchT <= 0) {
        if (S.lives <= 0) {
          showBill(false);
          return;
        }
        S.phase = "play";
        if (S.item && !S.item.falling && S.item.k !== "gurke" && S.item.ready) S.item.x = Math.max(START, S.item.x - 55);
        h.mad = false;
        away();
        h.t += 0.9;
        cat.mood = "normal";
      }
    }
    if (cat.vy !== 0 || cat.jump < 0) {
      cat.vy += 2200 * dt;
      cat.jump += cat.vy * dt;
      if (cat.jump >= 0) {
        cat.jump = 0;
        cat.vy = 0;
      }
    }
    if (S.phase === "play" || S.phase === "caught") {
      const c2 = S.item && S.item.k !== "gurke" && S.item.ready ? S.item.x - 80 : 72;
      cat.x += (c2 - cat.x) * Math.min(1, dt * 12);
      cat.reach += ((pushing ? 34 : hold && S.item && S.item.k !== "gurke" ? 10 : 0) - cat.reach) * Math.min(1, dt * 20);
      if (cat.moodT <= 0) {
        cat.mood = pushing ? "evil" : h.s === "look" || h.s === "warn" ? "innocent" : S.item && S.item.k === "gurke" ? "normal" : "normal";
      }
      if (S.phase === "play" && h.s === "look" && !pushing && h.turn > 0.7 && !h.praised && S.item && S.item.ready) {
        h.praised = true;
        float(Math.random() < 0.5 ? pick(CATS[sel].lines) : pick(EXCUSES), cat.x + 50, TABLE - 182, "#b93a67", 21, 1.5);
      }
      if (h.s !== "look") h.praised = false;
    }
    for (let i = S.parts.length - 1; i >= 0; i--) {
      const p = S.parts[i];
      p.vy += 1200 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.r += p.vr * dt;
      p.t -= dt;
      if (p.t <= 0) S.parts.splice(i, 1);
    }
    for (let i = S.floats.length - 1; i >= 0; i--) {
      const f = S.floats[i];
      f.t -= dt;
      f.y -= 24 * dt;
      if (f.t <= 0) S.floats.splice(i, 1);
    }
    setPaw();
  }
  function setPaw() {
    if (!overlay.hidden) {
      return;
    }
    const h = G.hu, i = G.item;
    let txt = "Halten zum Schubsen", cl = "";
    if (G.phase === "caught") {
      txt = "Erwischt!";
      cl = "stop";
    } else if (i && i.k === "gurke" && !i.gone) {
      txt = "Gurke! Finger weg!";
      cl = "stop";
    } else if (h.s === "look") {
      txt = "Loslassen!";
      cl = "stop";
    } else if (h.s === "warn") {
      txt = "Achtung!";
      cl = "warn";
    }
    if (paw.dataset.t !== txt) {
      paw.textContent = txt;
      paw.dataset.t = txt;
    }
    paw.className = (cl + (hold ? " down" : "")).trim();
  }
  const FISH = '<svg viewBox="0 0 30 20" aria-hidden="true"><path fill="FC" d="M2 10C7 3 15 2 21 7l7-5v16l-7-5C15 18 7 17 2 10z"/><circle cx="9" cy="8.5" r="1.7" fill="EC"/></svg>';
  function updateHud() {
    const R = room(), total = G.total;
    $("room").textContent = G.lvl + 1 + "/" + ROOMS.length + " " + R.name + " · " + Math.min(G.done, total) + " von " + total;
    $("money").textContent = eur(G.money) + " Schaden";
    let s = "";
    for (let i = 0; i < 3; i++) s += FISH.replace("FC", i < G.lives ? "#e85d8a" : "#e6c8c0").replace("EC", i < G.lives ? "#fffaf3" : "#fffaf3");
    $("lives").innerHTML = s;
    $("lives").setAttribute("aria-label", "Noch " + G.lives + " Leben");
  }
  function show(html) {
    card.innerHTML = html;
    overlay.hidden = false;
    paw.hidden = false;
    paw.textContent = "Halten zum Schubsen";
    paw.className = "";
    hold = false;
    overlay.scrollTop = 0;
  }
  function startLevel(n) {
    G.lvl = n;
    const R = room();
    G.queue = buildQueue(R, n);
    G.total = G.queue.length;
    G.done = 0;
    G.item = null;
    G.gap = 0.45;
    G.clean = true;
    G.floor = [];
    G.parts = [];
    G.floats = [];
    G.phase = "play";
    G.shout = rnd(4, 7);
    G.cat.x = 72;
    G.cat.reach = 0;
    G.cat.mood = "normal";
    G.hu = { s: "away", t: rnd(2.2, 3), turn: 0, say: R.who, sayT: 1.5 };
    overlay.hidden = true;
    updateHud();
  }
  function levelDone() {
    G.phase = "between";
    SND.win();
    let bonus = G.clean ? 20 : 0;
    if (bonus) {
      G.money += bonus;
      const b = G.bill["Engelsgesicht-Bonus"] || { n: 0, s: 0 };
      b.n++;
      b.s += bonus;
      G.bill["Engelsgesicht-Bonus"] = b;
      updateHud();
    }
    if (G.lvl >= G.order.length - 1) {
      showBill(true);
      return;
    }
    const nx = ROOMS[G.order[G.lvl + 1]], snack = G.lives < 3;
    if (snack) {
      G.lives++;
      updateHud();
    }
    show(`<h2>${room().name} geschafft!</h2><p>Bisher ${eur(G.money)} Schaden.${bonus ? " Nie erwischt: 20,00 € Engelsgesicht-Bonus." : ""}${snack ? " Leckerli gefunden: ein Leben zurück!" : ""}</p><p>Zimmer ${G.lvl + 2} von ${ROOMS.length}: <b>${nx.name}</b>. ${nx.who} Hier wird noch öfter geguckt.</p><button class="go" id="next" type="button">Ins nächste Zimmer</button>`);
    $("next").onclick = () => {
      audio();
      startLevel(G.lvl + 1);
    };
  }
  function rank(m) {
    return m < 300 ? "Nala-Niveau: Tisch gesucht, Wand gefunden" : m < 1200 ? "Lego-im-Flur-Katze" : m < 2400 ? "Aufräumtag-Auslöser" : "Family-Chaos-Großkatze";
  }
  function showBill(won) {
    if (G.phase !== "menu" && !won) {
      SND.soft();
    }
    G.phase = "over";
    const C = CATS[sel], k = "ta3-best-" + sel, old = parseFloat(store.get(k)) || 0, isBest = G.money > old;
    if (isBest) store.set(k, String(G.money));
    const lines = Object.keys(G.bill).map((n) => `<li><span>${G.bill[n].n > 1 ? G.bill[n].n + " × " : ""}${n}</span><span>${eur(G.bill[n].s)}</span></li>`).join("") || "<li><span>Nichts kaputt. Peinlich.</span><span>0,00 €</span></li>";
    show(`<h2>${won ? "Alles runter!" : "Hausarrest!"}</h2><p>${won ? "Alle acht Zimmer verwüstet. Kinder im Bett, " + C.name + " auf dem Sofa. Morgen um 6 maunzt Mogli. Wie immer." : C.name + " hat jetzt ein Erwischt-Abo. Papa guckt streng."}</p><ul class="bill">${lines}</ul><div class="total"><span>Rechnung</span><span>${eur(G.money)}</span></div><div class="rank">${rank(G.money)}${isBest ? " · Neuer Rekord für " + C.name : ""}</div><button class="go" id="again" type="button">Nochmal mit ${C.name}</button><button class="alt" id="other" type="button">Andere Katze wählen</button>`);
    $("again").onclick = () => {
      audio();
      begin();
    };
    $("other").onclick = menu;
  }
  function begin() {
    audio();
    meow();
    const keep = sel;
    G = fresh();
    sel = keep;
    startLevel(0);
  }
  function portraits() {
    document.querySelectorAll(".cat canvas").forEach((cv, i) => {
      const r = Math.max(2, Math.min(3, devicePixelRatio || 1)), q = cv.getContext("2d");
      cv.width = 170 * r;
      cv.height = 170 * r;
      const sv = x;
      const o = x;
      tempCtx(q, () => {
        q.setTransform(r, 0, 0, r, 0, 0);
        drawCat(CATS[i], 78, 160, { mood: i === sel ? "evil" : "normal", t: 0.5, s: 1.02 });
      });
    });
  }
  let swap = null;
  function tempCtx(q, fn) {
    const old = x;
    x = q;
    try {
      fn();
    } finally {
      x = old;
    }
  }
  function menu() {
    G = fresh();
    updateHud();
    $("money").textContent = "Bereit?";
    $("room").textContent = "Tassen-Attentat";
    show(`<h1>Tassen-Attentat</h1><ul class="how"><li><b>Gedrückt halten:</b> Deine Katze schubst alles vom Tisch.</li><li><b>Mensch dreht sich um?</b> Sofort loslassen und süß gucken.</li><li><b>Gurke?</b> Nicht anfassen. Katzen hassen Gurken.</li><li><b>Acht Zimmer</b> in zufälliger Reihenfolge. Jedes wird schwerer.</li></ul><div class="cats">${CATS.map((C, i) => {
      const b = parseFloat(store.get("ta3-best-" + i)) || 0;
      return `<button class="cat" type="button" data-i="${i}" aria-pressed="${i === sel}"><canvas aria-hidden="true"></canvas>${C.name}<span class="best">${b ? eur(b) : C.tag}</span></button>`;
    }).join("")}</div><button class="go" id="start" type="button">Los, Chaos machen!</button>`);
    portraits();
    card.querySelectorAll(".cat").forEach((b) => b.onclick = () => {
      audio();
      sel = +b.dataset.i;
      store.set("ta-cat", String(sel));
      meow(1 + sel * 0.12);
      card.querySelectorAll(".cat").forEach((o) => o.setAttribute("aria-pressed", o === b));
      portraits();
    });
    $("start").onclick = begin;
  }
  function press(e) {
    if (overlay.hidden && G.phase === "play" || G.phase === "caught") {
      audio();
      hold = true;
      if (e && e.preventDefault) e.preventDefault();
    }
  }
  function release() {
    hold = false;
  }
  if (window.PointerEvent) {
    paw.addEventListener("pointerdown", press);
    c.addEventListener("pointerdown", press);
    addEventListener("pointerup", release);
    addEventListener("pointercancel", release);
  } else {
    for (const el of [paw, c]) {
      el.addEventListener("touchstart", press, { passive: false });
      el.addEventListener("mousedown", press);
    }
    addEventListener("touchend", release);
    addEventListener("touchcancel", release);
    addEventListener("mouseup", release);
  }
  addEventListener("blur", release);
  document.addEventListener("visibilitychange", release);
  addEventListener("contextmenu", (e) => e.preventDefault());
  addEventListener("keydown", (e) => {
    if ((e.code === "Space" || e.key === " " || e.keyCode === 32 || e.keyCode === 13) && overlay.hidden && e.target !== paw || false) {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  addEventListener("keyup", (e) => {
    if (e.code === "Space" || e.keyCode === 32 || e.keyCode === 13) release();
  });
  paw.addEventListener("keydown", (e) => {
    if ((e.keyCode === 13 || e.keyCode === 32) && overlay.hidden) {
      e.preventDefault();
      if (!e.repeat) press();
    }
  });
  $("mute").onclick = () => {
    muted = !muted;
    audio();
    $("mute").textContent = muted ? "Stumm" : "Ton";
    $("mute").setAttribute("aria-label", muted ? "Ton an" : "Ton aus");
  };
  function fit() {
    const st = $("stage"), sc = Math.min(st.clientWidth / W, st.clientHeight / H) || 1, r = Math.max(2, Math.min(4, devicePixelRatio || 1));
    c.style.width = W * sc + "px";
    c.style.height = H * sc + "px";
    c.width = Math.min(2800, Math.round(W * sc * r));
    c._k = c.width / W;
    c.height = Math.round(H * c._k);
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe($("stage"));
  addEventListener("resize", fit);
  fit();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1e3);
    last = now;
    update(dt);
    x.setTransform(c._k, 0, 0, c._k, 0, 0);
    render();
    requestAnimationFrame(loop);
  }
  menu();
  requestAnimationFrame(loop);
})();
</script>
